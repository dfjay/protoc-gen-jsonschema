syntax = "proto3";

package tests;

import "dfjay/jsonschema/options.proto";

option (dfjay.jsonschema.file) = {entrypoint_message: "Values"};

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

message Values {
  google.protobuf.Any any = 1;

  google.protobuf.Duration duration = 2;

  google.protobuf.Timestamp timestamp = 3;

  google.protobuf.Empty empty = 4;

  google.protobuf.FieldMask field_mask = 5;

  google.protobuf.Struct struct = 6;

  google.protobuf.Value value = 7;

  google.protobuf.ListValue list_value = 8;

  google.protobuf.NullValue null_value = 9;

  google.protobuf.DoubleValue double_value = 10;

  google.protobuf.FloatValue float_value = 11;

  google.protobuf.Int64Value int64_value = 12;

  google.protobuf.UInt64Value uint64_value = 13;

  google.protobuf.Int32Value int32_value = 14;

  google.protobuf.UInt32Value uint32_value = 15;

  google.protobuf.BoolValue bool_value = 16;

  google.protobuf.StringValue string_value = 17;

  google.protobuf.BytesValue bytes_value = 18;

  repeated google.protobuf.Timestamp timestamps = 19;

  map<string, google.protobuf.Duration> duration_map = 20;

  map<string, google.protobuf.Int64Value> int64_value_map = 21;

  // Already accept null, so they are not wrapped in a nullable oneOf.
  optional google.protobuf.NullValue optional_null_value = 22;

  optional google.protobuf.Value optional_value = 23;

  double double = 24;

  // Bounded, so NaN and the infinities are not accepted.
  float bounded_float = 25 [(dfjay.jsonschema.field) = {numeric: {inclusive_minimum: 0}}];

  int64 int64 = 26;

  fixed64 fixed64 = 27;
}
