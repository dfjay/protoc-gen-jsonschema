syntax = "proto3";

package tests;

import "dfjay/jsonschema/options.proto";

option (dfjay.jsonschema.file) = {entrypoint_message: "Root"};

message Root {
  string name = 1 [(dfjay.jsonschema.field) = {required: true}];
  int32 age = 2;
  optional string nickname = 3;
  Bar bar = 4 [(dfjay.jsonschema.field) = {required: true}];
}

message Bar {
  string value = 1;
}
