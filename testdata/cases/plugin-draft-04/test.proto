syntax = "proto3";

package tests;

import "dfjay/jsonschema/options.proto";

option (dfjay.jsonschema.file) = {entrypoint_message: "Values"};

message Values {
  // default option
  string string1 = 1;

  // min/max
  string string2 = 2 [(dfjay.jsonschema.field) = {string: {min_length: 1, max_length: 100, }}];

  // min/max with zero value
  string string3 = 3 [(dfjay.jsonschema.field) = {string: {min_length: 0, max_length: 0, }}];

  // Exclusive maximum should convert to maximum: 10 and exclusive_maximum: true
  int64 int64 = 4 [(dfjay.jsonschema.field) = {numeric:{exclusive_maximum: 10}}];
}
