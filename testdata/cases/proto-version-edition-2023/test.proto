edition = "2023";

package tests;

import "dfjay/jsonschema/options.proto";

option (dfjay.jsonschema.file) = {entrypoint_message: "Values"};

message Values {
  string string_value = 1;

  int32 int32_value = 2;

  int64 int64_value = 3;

  string string_value2 = 4 [features.field_presence = LEGACY_REQUIRED];

  int32 int32_value2 = 5 [features.field_presence = LEGACY_REQUIRED];

  Nested nested_value = 6 [features.field_presence = LEGACY_REQUIRED];

  Enum enum_value = 7 [features.field_presence = LEGACY_REQUIRED];

  Nested optional_nested_value = 8;

  Enum optional_enum_value = 9;
}

message Nested {
  string value = 1 [features.field_presence = LEGACY_REQUIRED];
}

enum Enum {
  option features.enum_type = CLOSED;

  UNKNOWN = 0;
  ONE = 1;
  TWO = 2;
  THREE = 3;
}
