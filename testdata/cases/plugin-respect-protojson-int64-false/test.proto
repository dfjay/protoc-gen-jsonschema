syntax = "proto3";

package tests;

import "dfjay/jsonschema/options.proto";
import "google/protobuf/wrappers.proto";

option (dfjay.jsonschema.file) = {entrypoint_message: "Values"};

message Values {
  int64 int64_value = 1;

  repeated uint64 uint64_values = 2;

  map<string, sfixed64> sfixed64_map = 3;

  google.protobuf.Int64Value int64_wrapper = 4;

  int32 int32_value = 5;
}
