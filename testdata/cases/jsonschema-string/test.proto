syntax = "proto3";

package tests;

import "dfjay/jsonschema/options.proto";

option (dfjay.jsonschema.file) = {entrypoint_message: "Values"};

message Values {
  // default option
  string string1 = 1;

  // min/max
  string string2 = 2 [(dfjay.jsonschema.field) = {string: {min_length: 1, max_length: 100, }}];

  // min/max with zero value
  string string3 = 3 [(dfjay.jsonschema.field) = {string: {min_length: 0, max_length: 0, }}];

  // pattern
  // TODO: fail when pattern is not a valid regex
  string string4 = 4 [(dfjay.jsonschema.field) = {string: {pattern: "^[a-zA-Z0-9]+$", }}];

  // format
  // TODO: discuss) warn when format is not a predefined one?
  string string6 = 6 [(dfjay.jsonschema.field) = {string: {format: "date-time", }}];
}
