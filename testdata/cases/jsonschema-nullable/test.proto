syntax = "proto3";

package tests;

import "dfjay/jsonschema/options.proto";

option (dfjay.jsonschema.file) = {entrypoint_message: "Values"};

message Values {
  MyMessage messages = 1 [(dfjay.jsonschema.field) = {nullable:true}];

  MyEnum enums = 2 [(dfjay.jsonschema.field) = {nullable:true}];

  string strings = 3 [(dfjay.jsonschema.field) = {nullable:true}];

  int64 ints = 4 [(dfjay.jsonschema.field) = {nullable:false}];
}

message MyMessage {
  repeated string val1 = 1;

  repeated int64 val2 = 2;
}

enum MyEnum {
  FOO = 0;
  BAR = 1;
  BAZ = 2;
}
