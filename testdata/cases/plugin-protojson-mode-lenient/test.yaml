name: "plugin-protojson-mode-lenient"
description: "protojson_mode=Lenient accepts what ProtoJSON parsers accept"

inputFiles: ["test.proto"]
inputParameters:
  protojson_mode: Lenient

expectResultFiles: ["test.schema.json"]
expectResultIsNull: false
expectFail: false

expectedBehaviorDescription: "Every field accepts null; numbers in strings; enum names or numbers; URL-safe and unpadded base64; lenient integer map keys; a oneof member set to null is unset"
