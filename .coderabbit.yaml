language: en-US
tone_instructions: "Be brief and concrete. Bugs and security risks first; style only when it hurts readability."

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  review_details: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    # Generated by `just generate` and `just examples`; review the sources.
    - "!pkg/proto/*.pb.go"
    - "!options.md"
    - "!examples/*.json"
    - "!examples/*.yaml"
  path_instructions:
    - path: "proto/**"
      instructions: >-
        Public API: users set these options in their .proto files. Never
        renumber or reuse a field number, and keep the extension numbers
        11341-11345. A change here needs `just generate` (pkg/proto/options.pb.go,
        options.md) in the same PR.
    - path: "pkg/**"
      instructions: >-
        The output must be valid JSON Schema for the selected draft: draft-04
        has boolean exclusiveMinimum/exclusiveMaximum, draft-06 and later
        numbers; 2019-09 and 2020-12 use $defs. With the respect_protojson_*
        options, follow the ProtoJSON mapping (64-bit integers as strings,
        lowerCamelCase names unless preserve_proto_field_names). The output
        must be deterministic: the same input gives byte-identical schemas.
    - path: "testdata/cases/**"
      instructions: >-
        Expected schemas are written by `just golden`. A changed expected
        schema is a change in the plugin's output: check that the PR means it.
  tools:
    golangci-lint:
      enabled: true
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true

chat:
  auto_reply: true
